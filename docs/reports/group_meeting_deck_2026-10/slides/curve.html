<h2 style="font-family:'Noto Serif SC', Georgia, serif;font-size:56px;font-weight:700">学习曲线：v4 下滑，v7 保持</h2>
<img src="/_blob/74910dd56563652eeb51464c867b5df2" alt="累计准确率与最近 10 题滚动准确率：No Memory、v4、v7 随任务位置的变化（101 题）" style="width:1664px;height:605px;object-fit:contain;background:#FFFFFF;border-radius:12px">
<p style="font-family:'Noto Sans SC', Arial, sans-serif;position:absolute;left:128px;bottom:64px;font-size:24px;color:#6A7179">左：累计准确率；右：最近 10 题滚动准确率。101 题，逐题准确率平均（终点 40.8 / 31.9 / 29.3）。</p>
<aside>这是学习曲线。左图是累计准确率：v4 前期最高，之后一路下滑到 31.9%；v7 前期和 v4 差不多，之后基本稳定在 40% 左右；No Memory 在 29% 附近。右图是最近 10 题的滚动准确率，可以看到三条线经常一起起伏，比如第 60 到 90 题都在下降，这是题目难度在变，不是记忆在变。所以不能只看绝对准确率的走势，下一页我们去掉难度的影响。</aside>
