<p style="font-size:28px;color:#8FB8EE;font-weight:700">研究问题</p>
<h2 style="font-family:'Noto Serif SC', Georgia, serif;font-size:72px;font-weight:700;line-height:1.25">在官方评测协议下，跨任务的长期记忆<br>能否让一个 7B 网站生成模型<br><span style="color:#8FB8EE">越做越好</span>？</h2>
<p style="font-size:32px;color:#C9D3E3;line-height:1.5">"越做越好"= 后期任务的提升大于前期，且优于不带记忆的同一模型（No Memory）。</p>
<aside>所以研究问题是：在官方评测协议下，跨任务的长期记忆能不能让一个 7B 网站生成模型越做越好。这里有两个约束。第一是官方协议：只生成一次、不修复，所以记忆只能通过 prompt 起作用。第二是对照组：同一个模型、同一套评测、但不带记忆的 No Memory。“越做越好”的意思是，后段的提升不比前段小，并且要优于 No Memory。</aside>
