<p style="font-size:40px;color:#C9D3E3;line-height:1.4">跨任务经验积累在网站生成中的作用：<br>文字经验 vs 代码经验</p>

<aside>大家好，今天汇报我硕士课题第二阶段的进展。问题是：让一个只有 7B 参数的网站生成模型带上长期记忆，一个任务接一个任务做下去，它能不能越做越好。先说结论：纯文字的经验做不到，到后面甚至比不带记忆还差；把经验换成可以照抄的代码片段之后，101 道题的准确率从 28.5% 提到 40.0%，而且到后段依然保持领先。下面按论文的结构来讲。</aside>
